name: Deploy Opportunity Management to GitHub Pages

on:
  push:
    branches: [ main ]
    paths: [ 'partner-central-api-sample-codes/opportunityManagement/**' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./partner-central-api-sample-codes/opportunityManagement
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: partner-central-api-sample-codes/opportunityManagement/package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: Use the app HTML template
      # The repo ships public/index.html as a static landing page; the real
      # CRA template (with <div id="root">) is public/index-app.html. Swap it
      # in before building so React actually mounts (matches the README steps).
      run: cp public/index-app.html public/index.html
    - name: Build React app
      run: npm run build
      env:
        # Create React App treats lint warnings as errors when CI=true (the
        # default on GitHub Actions); keep the sample build resilient.
        CI: false
    - name: Setup Pages
      uses: actions/configure-pages@v4
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        # Publish the compiled SPA (includes the /test-workshop-setup page),
        # not the static public/ landing page.
        path: './partner-central-api-sample-codes/opportunityManagement/build'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4